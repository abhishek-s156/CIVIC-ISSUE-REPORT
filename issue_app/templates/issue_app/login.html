{% extends 'issue_app/base.html' %}

{% block page_content %}

<h2 class="mb-3">Login</h2>

<form method="post" style="max-width:400px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>

<p class="mt-3">New here? <a href="{% url 'signup_page' %}">Create an account</a></p>

{% endblock %}
