{% extends 'issue_app/base.html' %}

{% block page_content %}

<h2 class="mb-3">Create a New Account</h2>

<form method="post" style="max-width:400px;">
    {% csrf_token %}
    {{ signup_form.as_p }}
    <button type="submit" class="btn btn-primary">Sign Up</button>
</form>

<p class="mt-3">Already have an account? <a href="{% url 'login_page' %}">Login</a></p>

{% endblock %}
